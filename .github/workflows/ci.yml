name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: petora, POSTGRES_PASSWORD: petora, POSTGRES_DB: petora_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U petora" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Lint
        run: make lint
      - name: Unit tests
        run: go test ./internal/...
      - name: Integration tests
        run: make test-integration TEST_DATABASE_URL='postgres://petora:petora@localhost:5432/petora_test?sslmode=disable' TEST_REDIS_URL='redis://localhost:6379/15'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: flutter build apk --debug --dart-define=APP_ENV=dev

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^JWT_SECRET=$/JWT_SECRET=ci/;s/^POSTGRES_SUPERUSER_PASSWORD=$/POSTGRES_SUPERUSER_PASSWORD=ci/;s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/' .env
      - run: docker compose --profile prod config -q
      - run: docker build -t petora:ci .

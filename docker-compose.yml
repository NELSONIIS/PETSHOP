# PETORA production-style stack. Only the proxy publishes ports; everything else is on private networks.
#   cp .env.example .env   (fill in secrets)
#   docker compose up -d --build
# Staging: docker compose --env-file .env.staging -p petora-staging up -d
name: petora

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app: &app
  image: ${PETORA_IMAGE:-petora:latest}
  env_file: .env
  environment:
    DATABASE_URL: postgres://petora_app:${POSTGRES_APP_PASSWORD}@postgres:5432/petora?sslmode=disable
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    TRUST_PROXY: "true"
  volumes:
    - media:/data/storage
  networks: [backend]
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  proxy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deployments/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    depends_on:
      web-api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  web-api:
    <<: *app
    build: { context: ., args: { VERSION: "${VERSION:-dev}" } }
    command: ["serve"]
    deploy: { resources: { limits: { cpus: "1.5", memory: 768M } } }

  worker:
    <<: *app
    entrypoint: ["/app/worker"]
    command: []
    healthcheck: { disable: true }
    deploy: { resources: { limits: { cpus: "0.5", memory: 384M } } }

  # One-shot: applies migrations with the schema-owner role, then seeds reference data (idempotent).
  migrate:
    image: ${PETORA_IMAGE:-petora:latest}
    build: { context: . }
    env_file: .env
    environment:
      DATABASE_URL: postgres://petora_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/petora?sslmode=disable
      REDIS_URL: ""
    command: ["setup"]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: petora
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployments/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d petora"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
    shm_size: 256m
    deploy: { resources: { limits: { cpus: "1.5", memory: 1G } } }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    restart: unless-stopped
    logging: *logging
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  # Nightly encrypted pg_dump + media archive into ./backups (sync this directory off-site!).
  backup:
    build: { context: ., dockerfile: deployments/docker/Dockerfile.backup }
    image: petora-backup:latest
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PGDATABASE: petora
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}
    volumes:
      - ./deployments/scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - media:/media:ro
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging
    profiles: ["prod", "staging"]

networks:
  edge: {}
  backend:
    internal: true   # no route to the internet; only the proxy bridges edge <-> backend

volumes:
  pgdata: {}
  media: {}
  caddy_data: {}
  caddy_config: {}

# Local development dependencies only (run the Go server and Vite on the host).
#   docker compose -f docker-compose.dev.yml up -d
name: petora-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: petora, POSTGRES_PASSWORD: petora, POSTGRES_DB: petora_dev }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [devpg:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
volumes: { devpg: {} }
